<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拾光旧影 - AI老照片修复</title>
    <meta name="description" content="用AI的力量，让褪色的记忆重新鲜活。支持黑白上色、破损修复、清晰度增强、智能去噪。">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        parchment: '#FAF3E7',
                        cream: '#FFF8EE',
                        ink: '#2D2A26',
                        'ink-light': '#6B6560',
                        'ink-muted': '#9C968F',
                        amber: '#D4A35A',
                        'amber-light': '#E8C88A',
                        'amber-bg': '#F5E6CA',
                        coral: '#C47B5A',
                        sage: '#7A9E7E',
                        slate: '#7E8FA3',
                        sepia: '#E6D5B8',
                        'sepia-dark': '#C4A87C',
                        'frame-wood': '#8B7355',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } } 
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.8; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .anim-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
        .anim-float { animation: float 3s ease-in-out infinite; }
        .vintage-frame { border: 3px solid #8B7355; padding: 3px; background: #FFF8EE; box-shadow: inset 0 0 0 1px rgba(139,115,85,0.2), 0 8px 32px rgba(0,0,0,0.1); }
        .btn-primary { background: linear-gradient(135deg, #D4A35A, #C4934A); color: white; }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(212,163,90,0.4); }
        .btn-primary:active { transform: scale(0.97); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #FAF3E7; }
        ::-webkit-scrollbar-thumb { background: #C4A87C; border-radius: 3px; }
    </style>
</head>
<body class="bg-parchment text-ink min-h-screen">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useRef, useCallback, useEffect } = React;

        // Inline SVG icons (since lucide-react CDN might not work with Babel)
        const IconUpload = () => <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#D4A35A" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;
        const IconImage = ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
        const IconPalette = ({size=28}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#C47B5A" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>;
        const IconWrench = ({size=28}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#7A9E7E" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>;
        const IconSparkles = ({size=28}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#D4A35A" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>;
        const IconWind = ({size=28}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="#7E8FA3" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>;
        const IconDownload = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconRotateCcw = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>;
        const IconLayers = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
        const IconTrash = ({size=14}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const IconClock = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconUsers = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconChevronRight = ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"/></svg>;

        const API_BASE = '';

        const MODES = [
            { key: 'colorize', name: '黑白上色', desc: '为黑白照片注入自然色彩', Icon: IconPalette, color: '#C47B5A', bg: '#FDF1EC' },
            { key: 'repair', name: '破损修复', desc: '智能填补破损与划痕', Icon: IconWrench, color: '#7A9E7E', bg: '#F0F6F1' },
            { key: 'enhance', name: '清晰度增强', desc: '模糊照片变清晰', Icon: IconSparkles, color: '#D4A35A', bg: '#FDF7ED' },
            { key: 'denoise', name: '智能去噪', desc: '去除噪点保留细节', Icon: IconWind, color: '#7E8FA3', bg: '#EDF1F5' },
        ];

        const MODE_NAMES = { colorize: '黑白上色', repair: '破损修复', enhance: '清晰度增强', denoise: '智能去噪' };

        function App() {
            const [page, setPage] = useState('home');
            const [previewUrl, setPreviewUrl] = useState('');
            const [selectedMode, setSelectedMode] = useState('colorize');
            const [isProcessing, setIsProcessing] = useState(false);
            const [progress, setProgress] = useState(0);
            const [statusText, setStatusText] = useState('');
            const [result, setResult] = useState(null);
            const [comparePos, setComparePos] = useState(50);
            const [isDragging, setIsDragging] = useState(false);
            const [history, setHistory] = useState(() => {
                try { return JSON.parse(localStorage.getItem('sgjy_history') || '[]'); } catch { return []; }
            });
            const [dragOver, setDragOver] = useState(false);
            const fileInputRef = useRef(null);
            const compareRef = useRef(null);
            const selectedFileRef = useRef(null);

            const saveHistory = (items) => {
                setHistory(items);
                localStorage.setItem('sgjy_history', JSON.stringify(items.slice(0, 30)));
            };

            const handleFile = (file) => {
                if (file.size > 20 * 1024 * 1024) { alert('图片大小不能超过20MB'); return; }
                if (!file.type.startsWith('image/')) { alert('请上传图片文件'); return; }
                selectedFileRef.current = file;
                setPreviewUrl(URL.createObjectURL(file));
                setResult(null);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setDragOver(false);
                const file = e.dataTransfer.files[0];
                if (file) handleFile(file);
            };

            const startRepair = async () => {
                const file = selectedFileRef.current;
                if (!file || isProcessing) return;
                setIsProcessing(true);
                setProgress(0);
                setStatusText('正在上传照片...');
                setResult(null);

                try {
                    const formData = new FormData();
                    formData.append('image', file);
                    const uploadRes = await fetch(`${API_BASE}/api/upload`, { method: 'POST', body: formData });
                    const uploadData = await uploadRes.json();
                    if (uploadData.code !== 0) throw new Error(uploadData.message || '上传失败');
                    const fileId = uploadData.data.file_id;

                    const statusMap = { 20: '正在上传照片...', 35: 'AI正在分析照片特征...', 55: '正在进行智能修复...', 75: '优化修复细节...', 90: '即将完成...' };
                    let p = 15;
                    const interval = setInterval(() => {
                        p += Math.random() * 10;
                        if (p > 95) p = 95;
                        setProgress(Math.min(p, 100));
                        const key = Object.keys(statusMap).reverse().find(k => p >= parseInt(k));
                        if (key) setStatusText(statusMap[parseInt(key)]);
                    }, 500);

                    const repairRes = await fetch(`${API_BASE}/api/repair`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ file_id: fileId, mode: selectedMode }),
                    });
                    clearInterval(interval);
                    const repairData = await repairRes.json();
                    if (repairData.code !== 0) throw new Error(repairData.message || '修复失败');

                    setProgress(100);
                    setStatusText('修复完成！');
                    const rd = repairData.data;
                    const resUrl = rd.url || rd.preview_url || '';

                    setTimeout(() => {
                        setIsProcessing(false);
                        setResult({ fileId: rd.file_id, url: resUrl, mode: selectedMode, platform: rd.platform || 'AI', costTime: rd.cost_time || 0 });
                        saveHistory([{ id: rd.file_id, mode: selectedMode, modeName: MODE_NAMES[selectedMode], originalUrl: previewUrl, resultUrl: resUrl, platform: rd.platform || 'AI', costTime: rd.cost_time || 0, createdAt: new Date().toLocaleString('zh-CN') }, ...history]);
                    }, 600);
                } catch (err) {
                    setIsProcessing(false);
                    setProgress(0);
                    alert(err.message || '修复失败');
                }
            };

            const handleCompareMove = (clientX) => {
                if (!compareRef.current) return;
                const rect = compareRef.current.getBoundingClientRect();
                const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
                setComparePos((x / rect.width) * 100);
            };

            const clearAll = () => {
                selectedFileRef.current = null;
                setPreviewUrl('');
                setResult(null);
                setProgress(0);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const deleteHistoryItem = (id) => saveHistory(history.filter(h => h.id !== id));

            return (
                <div onMouseMove={e => isDragging && handleCompareMove(e.clientX)} onMouseUp={() => setIsDragging(false)} onTouchMove={e => isDragging && handleCompareMove(e.touches[0].clientX)} onTouchEnd={() => setIsDragging(false)}>
                    {/* Navbar */}
                    <nav className="sticky top-0 z-50 bg-parchment/90 backdrop-blur-xl border-b border-sepia/40">
                        <div className="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <div className="w-8 h-8 rounded-lg btn-primary flex items-center justify-center shadow-md">
                                    <IconImage size={16} />
                                </div>
                                <span className="font-bold text-lg text-ink">拾光旧影</span>
                            </div>
                            <div className="flex gap-1">
                                <button onClick={() => setPage('home')} className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${page === 'home' ? 'bg-amber-bg text-amber' : 'text-ink-light hover:bg-amber-bg/50'}`}>修复</button>
                                <button onClick={() => setPage('history')} className={`px-4 py-1.5 rounded-full text-sm font-medium transition-all ${page === 'history' ? 'bg-amber-bg text-amber' : 'text-ink-light hover:bg-amber-bg/50'}`}>历史</button>
                            </div>
                        </div>
                    </nav>

                    {/* HOME */}
                    {page === 'home' && (
                        <main className="max-w-3xl mx-auto px-4 pb-20">
                            {/* Hero */}
                            <section className="text-center pt-10 pb-6 anim-fade-in-up">
                                <div className="w-20 h-20 mx-auto mb-5 rounded-2xl btn-primary flex items-center justify-center shadow-lg anim-float">
                                    <IconImage size={36} />
                                </div>
                                <h1 className="text-3xl md:text-4xl font-bold text-ink mb-2">让旧时光，重现光彩</h1>
                                <p className="text-ink-light text-base">AI智能修复，让珍贵回忆清晰如初</p>
                                <div className="flex justify-center gap-8 mt-6">
                                    {[{ Icon: IconSparkles, label: '4种模式', num: 'AI修复' }, { Icon: IconClock, label: '< 10秒', num: '处理速度' }, { Icon: IconUsers, label: '免费体验', num: '3次/月' }].map((s, i) => (
                                        <div key={i} className="text-center">
                                            <s.Icon size={20} className="mx-auto mb-1 text-amber" />
                                            <div className="text-sm font-bold text-ink">{s.label}</div>
                                            <div className="text-xs text-ink-muted">{s.num}</div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {/* Upload */}
                            <section className="anim-fade-in-up" style={{ animationDelay: '0.1s' }}>
                                {!previewUrl ? (
                                    <div className={`border-2 border-dashed rounded-2xl p-10 text-center cursor-pointer transition-all ${dragOver ? 'border-amber bg-amber-bg' : 'border-sepia-dark bg-cream hover:border-amber hover:bg-amber-bg/50'}`}
                                        onClick={() => fileInputRef.current?.click()}
                                        onDrop={handleDrop}
                                        onDragOver={e => { e.preventDefault(); setDragOver(true); }}
                                        onDragLeave={() => setDragOver(false)}>
                                        <div className="mx-auto mb-3"><IconUpload /></div>
                                        <h3 className="text-lg font-semibold text-ink mb-1">点击或拖拽上传老照片</h3>
                                        <p className="text-sm text-ink-muted">支持 JPG、PNG、BMP 格式，最大 20MB</p>
                                        <input ref={fileInputRef} type="file" className="hidden" accept="image/*" onChange={e => e.target.files?.[0] && handleFile(e.target.files[0])} />
                                    </div>
                                ) : (
                                    <div className="relative rounded-2xl overflow-hidden bg-cream shadow-md">
                                        <img src={previewUrl} alt="预览" className="w-full max-h-80 object-contain" />
                                        <button onClick={clearAll} className="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/50 text-white flex items-center justify-center hover:bg-coral transition-colors">
                                            <IconTrash />
                                        </button>
                                    </div>
                                )}
                            </section>

                            {/* Mode Selection */}
                            <section className="mt-6 anim-fade-in-up" style={{ animationDelay: '0.2s' }}>
                                <h2 className="text-base font-bold text-ink mb-3 flex items-center gap-2">
                                    <IconLayers size={18} className="text-amber" />
                                    选择修复模式
                                </h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    {MODES.map(m => {
                                        const isSel = selectedMode === m.key;
                                        return (
                                            <button key={m.key} onClick={() => setSelectedMode(m.key)}
                                                className={`relative text-left p-4 rounded-xl border-2 transition-all hover:shadow-md ${isSel ? 'border-amber shadow-md' : 'border-transparent bg-cream'}`}
                                                style={isSel ? { background: m.bg } : {}}>
                                                <div className="absolute left-0 top-0 bottom-0 w-1 rounded-r" style={{ background: m.color }} />
                                                <m.Icon size={28} />
                                                <h3 className="text-sm font-bold text-ink mt-2">{m.name}</h3>
                                                <p className="text-xs text-ink-light mt-0.5 leading-relaxed">{m.desc}</p>
                                                {isSel && <div className="absolute top-3 right-3 w-5 h-5 rounded-full bg-amber text-white flex items-center justify-center text-xs font-bold">✓</div>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </section>

                            {/* Start Button */}
                            {previewUrl && !result && (
                                <section className="mt-6 text-center anim-fade-in-up">
                                    <button onClick={startRepair} disabled={isProcessing}
                                        className="px-12 py-4 btn-primary font-bold text-lg rounded-2xl shadow-lg shadow-amber/30 active:scale-[0.97] transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                                        {isProcessing ? '处理中...' : '🚀 开始AI修复'}
                                    </button>
                                    <p className="text-xs text-ink-muted mt-3">新用户免费体验3次 · 处理约需3-10秒</p>
                                </section>
                            )}

                            {/* Processing */}
                            {isProcessing && (
                                <div className="fixed inset-0 bg-parchment/95 z-50 flex items-center justify-center flex-col">
                                    <div className="relative w-28 h-28 mb-6">
                                        <svg className="w-full h-full -rotate-90" viewBox="0 0 120 120">
                                            <circle cx="60" cy="60" r="52" fill="none" stroke="#E6D5B8" strokeWidth="6" />
                                            <circle cx="60" cy="60" r="52" fill="none" stroke="#D4A35A" strokeWidth="6" strokeLinecap="round"
                                                strokeDasharray={2 * Math.PI * 52}
                                                strokeDashoffset={2 * Math.PI * 52 * (1 - progress / 100)}
                                                className="transition-all duration-300" />
                                        </svg>
                                        <div className="absolute inset-0 flex items-center justify-center">
                                            <span className="text-2xl font-bold text-amber">{Math.round(progress)}%</span>
                                        </div>
                                    </div>
                                    <h2 className="text-xl font-bold text-ink mb-1">AI正在修复中...</h2>
                                    <p className="text-sm text-ink-muted mb-4">请稍候，正在为您处理照片</p>
                                    <p className="text-sm text-amber font-medium min-h-[20px]">{statusText}</p>
                                </div>
                            )}

                            {/* Result */}
                            {result && (
                                <section className="mt-6 anim-fade-in-up">
                                    <h2 className="text-xl font-bold text-ink mb-4 text-center">✨ 修复完成</h2>
                                    <div className="flex justify-center gap-2 mb-4">
                                        <span className="px-3 py-1 rounded-full text-xs font-semibold" style={{ background: MODES.find(m => m.key === result.mode)?.bg, color: MODES.find(m => m.key === result.mode)?.color }}>{MODE_NAMES[result.mode]}</span>
                                        <span className="px-3 py-1 rounded-full text-xs font-semibold bg-amber-bg text-amber">{result.platform}</span>
                                        <span className="px-3 py-1 rounded-full text-xs font-semibold bg-sepia/30 text-ink-light">{result.costTime.toFixed(1)}秒</span>
                                    </div>

                                    {/* Compare Slider */}
                                    <div ref={compareRef} className="relative rounded-xl overflow-hidden cursor-ew-resize select-none vintage-frame"
                                        onMouseDown={e => { setIsDragging(true); handleCompareMove(e.clientX); }}
                                        onTouchStart={e => { setIsDragging(true); handleCompareMove(e.touches[0].clientX); }}>
                                        <img src={result.url} alt="修复后" className="w-full block" />
                                        <div className="absolute top-0 left-0 h-full overflow-hidden" style={{ width: `${comparePos}%` }}>
                                            <img src={previewUrl} alt="原图" className="h-full w-auto max-w-none" style={{ width: `${100 / Math.max(comparePos, 1) * 100}%` }} />
                                        </div>
                                        <div className="absolute top-0 bottom-0 w-10 -translate-x-1/2 flex items-center justify-center pointer-events-none" style={{ left: `${comparePos}%` }}>
                                            <div className="absolute w-0.5 h-full bg-amber shadow-[0_0_10px_rgba(212,163,90,0.5)]" />
                                            <div className="w-10 h-10 rounded-full bg-gradient-to-br from-amber to-amber-light flex items-center justify-center text-white text-xs font-bold shadow-lg">◀ ▶</div>
                                        </div>
                                        <div className="absolute bottom-3 left-3 px-2 py-1 rounded-lg bg-sepia/80 text-xs font-semibold text-ink">原图</div>
                                        <div className="absolute bottom-3 right-3 px-2 py-1 rounded-lg btn-primary text-xs font-semibold">修复后</div>
                                    </div>

                                    <div className="flex gap-3 mt-6 justify-center flex-wrap">
                                        <a href={result.url} download className="flex items-center gap-2 px-6 py-3 btn-primary font-semibold rounded-xl shadow-lg shadow-amber/30 active:scale-[0.97] transition-all">
                                            <IconDownload /> 下载修复图
                                        </a>
                                        <button onClick={clearAll} className="flex items-center gap-2 px-6 py-3 border-2 border-sepia-dark text-ink font-semibold rounded-xl hover:bg-amber-bg active:scale-[0.97] transition-all">
                                            <IconRotateCcw /> 重新修复
                                        </button>
                                    </div>
                                </section>
                            )}
                        </main>
                    )}

                    {/* HISTORY */}
                    {page === 'history' && (
                        <main className="max-w-3xl mx-auto px-4 pb-20 pt-6">
                            <h2 className="text-xl font-bold text-ink mb-4">修复历史</h2>
                            {history.length === 0 ? (
                                <div className="text-center py-20">
                                    <IconImage size={64} className="mx-auto mb-4 text-ink-muted" />
                                    <h3 className="text-lg font-semibold text-ink mb-1">暂无修复记录</h3>
                                    <p className="text-sm text-ink-muted mb-4">上传一张照片开始您的修复之旅</p>
                                    <button onClick={() => setPage('home')} className="px-6 py-2.5 btn-primary font-semibold rounded-xl active:scale-[0.97] transition-all">去修复 <IconChevronRight /></button>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {history.map(item => (
                                        <div key={item.id} className="flex gap-4 p-4 bg-cream rounded-xl shadow-sm hover:shadow-md transition-shadow">
                                            <img src={item.originalUrl} alt="原图" className="w-20 h-20 rounded-lg object-cover flex-shrink-0" />
                                            <div className="flex-1 min-w-0">
                                                <div className="flex items-center gap-2 mb-1">
                                                    <h4 className="text-sm font-bold text-ink">{item.modeName}</h4>
                                                    <span className="px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-bg text-amber">{item.platform}</span>
                                                </div>
                                                <p className="text-xs text-ink-muted">{item.createdAt} · {item.costTime.toFixed(1)}秒</p>
                                                <a href={item.resultUrl} download className="inline-flex items-center gap-1 mt-2 text-xs text-amber font-medium hover:underline">
                                                    <IconDownload size={12} /> 下载
                                                </a>
                                            </div>
                                            <button onClick={() => deleteHistoryItem(item.id)} className="self-start p-1.5 rounded-lg hover:bg-red-50 text-ink-muted hover:text-coral transition-colors">
                                                <IconTrash />
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </main>
                    )}

                    {/* Footer */}
                    <footer className="text-center py-6 border-t border-sepia/40 mt-10">
                        <p className="text-xs text-ink-muted">拾光旧影 AI老照片修复 · 让每一份记忆都清晰如初</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
